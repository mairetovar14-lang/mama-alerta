
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mamá Alerta</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#8f3f52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mamá Alerta">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --rosa-suave:#e9b8c0; --rosa-media:#d68a97; --rosa-profunda:#8f3f52;
    --crema:#fbf3ee; --crema-panel:#ffffff; --ciruela:#382230; --ciruela-suave:#6b5560;
    --linea:#e9d9d4; --salvia:#5f8a6a; --salvia-fondo:#e7f0e5; --ambar:#b9791f; --ambar-fondo:#faedd8;
    --burdeos:#a3323a; --burdeos-fondo:#f8dede; --sombra:0 1px 0 rgba(56,34,48,0.06); --radio:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--crema); color:var(--ciruela); font-family:"Work Sans",system-ui,sans-serif; line-height:1.5; min-height:100vh;}
  #app{min-height:100%;}
  body.pantalla-auth .main-inner{padding:0; max-width:none;}
  body.pantalla-auth .main-wrap{align-items:center; justify-content:center; display:flex;}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif; font-weight:600; margin:0 0 6px; color:var(--ciruela); line-height:1.15;}
  h1{font-size:1.7rem; font-weight:700;} h2{font-size:1.28rem;} h3{font-size:1.05rem;}
  p{margin:0 0 10px;}
  .muted{color:var(--ciruela-suave); font-size:0.92rem;}
  header.top{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--linea);}
  header.top .brand{display:flex; align-items:center; gap:8px;}
  header.top .brand .mark{font-size:1.4rem;}
  header.top .brand h1{font-size:1.35rem;}
  header.top .sub{font-size:0.82rem; color:var(--ciruela-suave); text-align:right; cursor:pointer;}
  .panel{background:var(--crema-panel); border:1px solid var(--linea); border-radius:var(--radio); padding:20px; margin-bottom:16px; box-shadow:var(--sombra);}
  label{display:block; font-size:0.86rem; font-weight:600; margin:0 0 5px; color:var(--ciruela-suave);}
  .campo{margin-bottom:14px;}
  input[type=text],input[type=tel],input[type=number],input[type=date],input[type=email],input[type=password]{
    width:100%; font-family:inherit; font-size:1rem; padding:10px 12px; border-radius:9px; border:1.5px solid var(--linea); background:var(--crema); color:var(--ciruela);
  }
  input:focus{outline:2px solid var(--rosa-media); outline-offset:1px;}
  .fila2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  button{font-family:inherit; font-size:0.98rem; font-weight:600; cursor:pointer; border-radius:10px; border:none; padding:13px 18px;}
  .btn-primaria{background:var(--rosa-profunda); color:#fff; width:100%;}
  .btn-primaria:disabled{opacity:0.6;}
  .btn-secundaria{background:transparent; color:var(--rosa-profunda); border:1.5px solid var(--rosa-profunda); width:100%;}
  .btn-texto{background:none; color:var(--ciruela-suave); padding:8px 4px; text-decoration:underline; font-weight:500;}
  .btn-fila{display:flex; gap:10px; margin-top:16px;}
  .btn-fila button{flex:1;}
  .error-msg{background:var(--burdeos-fondo); color:var(--burdeos); padding:10px 12px; border-radius:9px; font-size:0.88rem; margin-bottom:12px;}
  .info-msg{background:var(--salvia-fondo); color:var(--salvia); padding:10px 12px; border-radius:9px; font-size:0.88rem; margin-bottom:12px;}
  .olvide{display:block; text-align:right; font-size:0.83rem; color:var(--rosa-profunda); text-decoration:none; margin:-6px 0 16px; cursor:pointer; font-weight:600;}
  .recuperar-volver{display:block; text-align:center; font-size:0.85rem; color:var(--ciruela-suave); margin-top:14px; cursor:pointer; text-decoration:underline;}
  .tabs{display:flex; gap:8px; margin-bottom:16px;}
  .tabs button{flex:1; background:var(--crema); border:1.5px solid var(--linea); color:var(--ciruela-suave);}
  .tabs button.activo{background:var(--rosa-profunda); color:#fff; border-color:var(--rosa-profunda);}

  /* ---- pantalla de inicio de sesión ---- */
  body.pantalla-auth{
    background:
      radial-gradient(560px 420px at 12% -8%, #f6d9de 0%, rgba(246,217,222,0) 60%),
      radial-gradient(520px 420px at 108% 12%, #f0c9d2 0%, rgba(240,201,210,0) 55%),
      var(--crema);
  }
  .auth-wrap{max-width:400px; margin:0 auto; padding:56px 20px 40px; min-height:100vh;}
  .auth-hero{text-align:center; margin-bottom:30px;}
  .auth-hero .icono{
    width:64px; height:64px; margin:0 auto 18px; border-radius:20px;
    background:linear-gradient(150deg, var(--rosa-suave), var(--rosa-profunda));
    display:flex; align-items:center; justify-content:center; font-size:30px;
    box-shadow:0 10px 24px -8px rgba(143,63,82,0.45);
  }
  .auth-hero h1{font-size:1.9rem; margin-bottom:6px;}
  .auth-hero p{color:var(--ciruela-suave); font-size:0.95rem; margin:0;}
  .auth-card{
    background:var(--crema-panel); border-radius:22px; padding:26px 24px 24px;
    box-shadow:0 20px 40px -18px rgba(56,34,48,0.22), 0 1px 0 rgba(56,34,48,0.04);
    border:1px solid var(--linea);
  }
  .segmented{
    display:flex; background:var(--crema); border-radius:12px; padding:4px; margin-bottom:22px; gap:4px;
  }
  .segmented button{
    flex:1; background:transparent; color:var(--ciruela-suave); border:none; border-radius:9px;
    padding:9px 6px; font-size:0.9rem; transition:background .15s, color .15s, box-shadow .15s;
  }
  .segmented button.activo{background:var(--crema-panel); color:var(--rosa-profunda); box-shadow:0 2px 8px -2px rgba(56,34,48,0.18);}
  .auth-card label{font-size:0.8rem; letter-spacing:.01em;}
  .auth-card input{padding:12px 14px; border-radius:11px; font-size:0.98rem;}
  .auth-card .btn-primaria{
    background:linear-gradient(135deg, var(--rosa-profunda), #7a3346);
    border-radius:11px; padding:14px; margin-top:4px;
    box-shadow:0 12px 22px -10px rgba(143,63,82,0.55);
  }
  .auth-foot{text-align:center; color:var(--ciruela-suave); font-size:0.82rem; margin-top:22px;}

  .banner-offline{
    display:flex; align-items:center; gap:8px; justify-content:center;
    background:var(--ambar-fondo); color:var(--ambar); font-size:0.82rem; font-weight:600;
    padding:9px 14px; text-align:center;
  }
  .banner-instalar{
    display:flex; align-items:center; gap:10px; justify-content:space-between;
    background:var(--rosa-profunda); color:#fff; font-size:0.85rem; font-weight:600;
    padding:10px 14px; text-align:left;
  }
  .banner-instalar button{
    background:#fff; color:var(--rosa-profunda); border:none; border-radius:8px;
    padding:8px 12px; font-size:0.82rem; font-weight:700; white-space:nowrap;
  }
  .banner-instalar .cerrar{background:none; color:#fff; padding:4px 6px; font-weight:700; opacity:0.85;}

  .recordatorio{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:0.88rem; font-weight:600;
  }
  .recordatorio-neutro{background:var(--crema-panel); border:1px solid var(--linea); color:var(--ciruela-suave);}
  .recordatorio-cercano{background:var(--ambar-fondo); color:var(--ambar);}
  .recordatorio-hoy{background:var(--rosa-suave); color:var(--rosa-profunda);}
  .recordatorio-vencido{background:var(--linea); color:var(--ciruela-suave);}
  .respaldo-pendiente{border:1.5px dashed var(--ambar); background:var(--ambar-fondo);}
  .respaldo-pendiente h3{color:var(--ambar);}
  .respaldo-activo{border:1.5px solid var(--salvia); background:var(--salvia-fondo);}
  .respaldo-activo h3{color:var(--salvia);}
  .recordatorio .editar-link{font-weight:600; text-decoration:underline; white-space:nowrap; cursor:pointer; color:inherit;}

  .alerta-tendencia{
    background:var(--ambar-fondo); border:2px solid var(--ambar); border-radius:var(--radio);
    padding:18px; margin-bottom:14px;
  }
  .alerta-tendencia h3{color:var(--ambar); font-size:1.05rem; margin-bottom:6px;}

  .qr-contenedor{display:flex; justify-content:center; padding:14px 0; background:#fff; border-radius:12px;}

  .checks-grid{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:6px;}
  .check-opcion{display:flex; align-items:center; gap:6px; font-size:0.88rem; font-weight:500; color:var(--ciruela); flex:1 1 45%; min-width:150px;}
  .check-opcion input{width:auto;}
  .sn-inline{display:flex; gap:20px; margin-top:6px;}
  .opcion-inline{display:flex; align-items:center; gap:6px; font-weight:500; font-size:0.92rem; color:var(--ciruela);}
  .opcion-inline input{width:auto;}
  .detalle-condicional{background:var(--crema); border-radius:9px; padding:12px; margin-top:-4px;}
  .chip-fila{display:flex; gap:8px; margin:14px 0;}
  .chip{flex:1; text-align:center; padding:10px 6px; border-radius:9px; background:var(--crema); border:1.5px solid var(--linea); font-weight:600; font-size:1.05rem;}
  .chip .n{font-size:0.72rem; font-weight:500; color:var(--ciruela-suave); display:block; margin-top:2px;}
  .pregunta{padding:14px 0; border-bottom:1px solid var(--linea);}
  .pregunta:last-child{border-bottom:none;}
  .pregunta p.texto{font-weight:500; margin-bottom:10px; color:var(--ciruela);}
  .sn{display:flex; gap:10px;}
  .sn label.opcion{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border-radius:9px; border:1.5px solid var(--linea); font-weight:600; font-size:0.92rem; color:var(--ciruela-suave); cursor:pointer;}
  .sn input{position:absolute; opacity:0; pointer-events:none;}
  .sn label.opcion.si.marcada{background:var(--burdeos-fondo); border-color:var(--burdeos); color:var(--burdeos);}
  .sn label.opcion.no.marcada{background:var(--salvia-fondo); border-color:var(--salvia); color:var(--salvia);}
  .progreso{display:flex; gap:6px; margin-bottom:18px;}
  .progreso .paso{flex:1; height:4px; border-radius:3px; background:var(--linea);}
  .progreso .paso.activo{background:var(--rosa-profunda);}
  .resultado-bp{border-radius:var(--radio); padding:18px; margin-bottom:14px;}
  .resultado-bp.n1{background:var(--salvia-fondo);} .resultado-bp.n2{background:var(--ambar-fondo);} .resultado-bp.n3{background:var(--burdeos-fondo);}
  .resultado-bp .etiqueta{font-family:"Fraunces",serif; font-weight:700; font-size:1.1rem; margin-bottom:4px;}
  .resultado-bp.n1 .etiqueta{color:var(--salvia);} .resultado-bp.n2 .etiqueta{color:var(--ambar);} .resultado-bp.n3 .etiqueta{color:var(--burdeos);}
  .flor-resultado{text-align:center; padding:26px 18px; border-radius:var(--radio); margin-bottom:14px;}
  .flor-resultado .emoji{font-size:3rem; display:block; margin-bottom:8px;}
  .flor-resultado.bajo{background:var(--salvia-fondo);} .flor-resultado.moderado{background:var(--ambar-fondo);} .flor-resultado.alto{background:var(--burdeos-fondo);}
  .flor-resultado .nivel{font-family:"Fraunces",serif; font-weight:700; font-size:1.2rem;}
  .flor-resultado.bajo .nivel{color:var(--salvia);} .flor-resultado.moderado .nivel{color:var(--ambar);} .flor-resultado.alto .nivel{color:var(--burdeos);}
  .alerta-medica{background:var(--burdeos-fondo); border:2px solid var(--burdeos); border-radius:var(--radio); padding:18px; margin-bottom:14px;}
  .alerta-medica h3{color:var(--burdeos); font-size:1.15rem; margin-bottom:8px;}
  .alerta-medica ul{margin:8px 0 12px; padding-left:20px;} .alerta-medica li{margin-bottom:4px;}
  .btn-llamar{display:block; text-align:center; background:var(--burdeos); color:#fff; text-decoration:none; padding:13px; border-radius:10px; font-weight:700; margin-top:10px;}
  .historial-item{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--linea); cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left;}
  .historial-item:last-child{border-bottom:none;}
  .historial-item .flor{font-size:1.4rem;} .historial-item .datos{flex:1;} .historial-item .fecha{font-weight:600; font-size:0.92rem;} .historial-item .bp{font-size:0.82rem; color:var(--ciruela-suave);}
  .punto{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}
  .punto.n1{background:var(--salvia);} .punto.n2{background:var(--ambar);} .punto.n3{background:var(--burdeos);}
  .vacio{text-align:center; padding:30px 10px; color:var(--ciruela-suave);}
  .vacio .emoji{font-size:2.2rem; display:block; margin-bottom:10px;}
  .ficha-dato{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--linea); font-size:0.92rem;}
  .ficha-dato:last-child{border-bottom:none;} .ficha-dato .k{color:var(--ciruela-suave);} .ficha-dato .v{font-weight:600; text-align:right;}
  .leyenda{font-size:0.86rem; color:var(--ciruela-suave); margin-top:10px;}
  .leyenda .fila{display:flex; gap:8px; align-items:flex-start; margin-bottom:6px;} .leyenda .fila span.e{font-size:1.1rem;}
  .cargando{text-align:center; padding:60px 10px; color:var(--ciruela-suave);}
  @media (max-width:360px){ .fila2{grid-template-columns:1fr;} }
  /* ============================================================
     BARRA LATERAL + estructura general de la app (pantallas internas)
     ============================================================ */
  #shell{display:flex; min-height:100vh;}
  #sidebar{
    width:260px; flex:0 0 260px; min-height:100vh;
    background:linear-gradient(160deg, var(--rosa-profunda) 0%, #5c2438 100%);
    color:#fff; padding:26px 20px; position:fixed; top:0; left:0; bottom:0;
    display:flex; flex-direction:column; z-index:40;
    transform:translateX(0); transition:transform .25s ease;
  }
  #sidebar .sb-brand{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  #sidebar .sb-brand .mark{font-size:1.6rem;}
  #sidebar .sb-brand h1{color:#fff; font-size:1.3rem; margin:0;}
  #sidebar .sb-tagline{color:rgba(255,255,255,0.75); font-size:0.82rem; margin:2px 0 18px;}
  #sidebar .sb-linea{border:none; border-top:1px solid rgba(255,255,255,0.18); margin:0 0 16px;}
  #sidebar nav{display:flex; flex-direction:column; gap:4px;}
  #sidebar nav button{
    display:flex; align-items:center; gap:12px; background:none; border:none; color:rgba(255,255,255,0.85);
    font-family:inherit; font-size:0.95rem; font-weight:600; text-align:left; padding:11px 14px;
    border-radius:12px; cursor:pointer;
  }
  #sidebar nav button svg{flex:0 0 auto; opacity:0.9;}
  #sidebar nav button.activo{background:rgba(255,255,255,0.94); color:var(--rosa-profunda);}
  #sidebar nav button.activo svg{opacity:1;}
  #sidebar .sb-ilustracion{margin-top:auto; opacity:0.9; display:flex; justify-content:center;}
  #sidebar .sb-cerrar{display:none;}

  #capa-sidebar{display:none;}

  .main-wrap{flex:1 1 auto; margin-left:260px; min-height:100vh; display:flex; flex-direction:column;}
  .main-inner{max-width:760px; width:100%; margin:0 auto; padding:22px 26px 64px; flex:1;}
  body.pantalla-auth .main-wrap{margin-left:0;}
  body.pantalla-auth #sidebar{display:none;}

  .btn-hamburguesa{
    display:none; background:var(--crema-panel); border:1px solid var(--linea); border-radius:10px;
    width:38px; height:38px; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto;
  }

  @media (max-width:900px){
    #sidebar{transform:translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,0.35);}
    #shell.sidebar-abierta #sidebar{transform:translateX(0);}
    #shell.sidebar-abierta #capa-sidebar{
      display:block; position:fixed; inset:0; background:rgba(30,15,20,0.45); z-index:35;
    }
    #sidebar .sb-cerrar{
      display:flex; align-items:center; justify-content:center; position:absolute; top:18px; right:18px;
      width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.15); color:#fff; border:none; cursor:pointer;
    }
    .main-wrap{margin-left:0;}
    .main-inner{padding:16px 16px 56px;}
    .btn-hamburguesa{display:flex;}
  }

  /* ---- barra superior dentro del contenido (logo + usuaria) ---- */
  .top-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--linea);}
  .top-bar .brand{display:flex; align-items:center; gap:8px;}
  .top-bar .brand .mark{font-size:1.4rem;}
  .top-bar .brand h1{font-size:1.35rem; margin:0;}
  .top-bar .brand-fila{display:flex; align-items:center; gap:10px;}
  .top-bar .sub{font-size:0.85rem; color:var(--ciruela-suave); text-align:right; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .top-bar .sub .avatar{width:26px; height:26px; border-radius:50%; background:var(--rosa-suave); color:var(--rosa-profunda); display:flex; align-items:center; justify-content:center;}

  /* ---- ícono circular usado en tarjetas ---- */
  .icono-badge{
    width:40px; height:40px; border-radius:50%; background:var(--salvia-fondo,var(--rosa-suave));
    background:var(--rosa-suave); color:var(--rosa-profunda);
    display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .icono-badge.ambar{background:var(--ambar-fondo); color:var(--ambar);}
  .icono-badge.burdeos{background:var(--burdeos-fondo); color:var(--burdeos);}
  .icono-badge.salvia{background:var(--salvia-fondo); color:var(--salvia);}

  .fila-titulo{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .fila-titulo h3{margin:0;}
  .fila-titulo.con-accion{justify-content:space-between;}
  .fila-titulo .titulo-txt{flex:1;}

  .enlace-flecha{
    display:inline-flex; align-items:center; gap:4px; color:var(--rosa-profunda); font-weight:700;
    font-size:0.88rem; text-decoration:none; cursor:pointer; background:none; border:none; padding:0;
  }
  .btn-primaria.con-icono, .btn-secundaria.con-icono{
    display:flex; align-items:center; gap:10px; text-align:left;
  }
  .btn-primaria.con-icono .ic-izq, .btn-secundaria.con-icono .ic-izq{display:flex; opacity:0.95;}
  .btn-primaria.con-icono .txt, .btn-secundaria.con-icono .txt{flex:1;}
  .btn-primaria.con-icono .ic-der, .btn-secundaria.con-icono .ic-der{opacity:0.85;}

  .fila-dato-ic{display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--linea);}
  .fila-dato-ic:last-child{border-bottom:none;}
  .fila-dato-ic .ic{width:32px; height:32px; border-radius:9px; background:var(--crema); color:var(--rosa-profunda); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
  .fila-dato-ic .txt{flex:1; display:flex; flex-direction:column;}
  .fila-dato-ic .txt .k{font-size:0.78rem; color:var(--ciruela-suave);}
  .fila-dato-ic .txt .v{font-weight:700; color:var(--ciruela);}

  .caja-metrica{
    flex:1; background:var(--crema); border-radius:12px; padding:14px; display:flex; align-items:center; gap:10px;
  }
  .caja-metrica.tono-ambar{background:var(--ambar-fondo);}
  .caja-metrica.tono-burdeos{background:var(--burdeos-fondo);}
  .caja-metrica.tono-salvia{background:var(--salvia-fondo);}
  .caja-metrica .ic{flex:0 0 auto;}
  .caja-metrica .valor{font-weight:700; font-size:1.15rem; line-height:1.1;}
  .caja-metrica .etiqueta{font-size:0.76rem; color:var(--ciruela-suave);}
  .caja-metrica.tono-ambar .valor, .caja-metrica.tono-ambar .ic{color:var(--ambar);}
  .caja-metrica.tono-burdeos .valor, .caja-metrica.tono-burdeos .ic{color:var(--burdeos);}
  .caja-metrica.tono-salvia .valor, .caja-metrica.tono-salvia .ic{color:var(--salvia);}

  function diasHasta(fechaISO){
    if(!fechaISO) return null;
    var hoy = new Date(); hoy.setHours(0,0,0,0);
    var f = new Date(fechaISO+"T00:00:00");
    return Math.round((f - hoy) / 86400000);
  }

  // ---------- control diario ----------
  function vistaControl(){
    var paso = estado.controlPaso;
    var barra = '<div class="progreso">'+[1,2,3].map(function(n){return '<div class="paso'+(n<=paso?" activo":"")+'"></div>';}).join("")+'</div>';
    var contenido = "";
    if(paso===1){
      contenido = '<div class="panel"><h2>Presión arterial</h2><p class="muted">Indica tu presión arterial de hoy (ej: 120/80).</p>'+
        '<div class="fila2"><div class="campo"><label>Sistólica</label><input type="number" id="in-sistolica" value="'+esc(estado.controlDatos.sistolica)+'" placeholder="120"></div>'+
        '<div class="campo"><label>Diastólica</label><input type="number" id="in-diastolica" value="'+esc(estado.controlDatos.diastolica)+'" placeholder="80"></div></div>'+
        '<div class="leyenda">'+
        '<div class="fila"><span class="e">✅</span><span><b>Normal/estable:</b> menos de 120/80 mmHg</span></div>'+
        '<div class="fila"><span class="e">⚠️</span><span><b>Requiere vigilancia:</b> 120–139 / 80–89 mmHg</span></div>'+
        '<div class="fila"><span class="e">❌</span><span><b>Sospecha de preeclampsia:</b> 140/90 mmHg o más</span></div>'+
        '</div></div>';
    } else if(paso===2){
      contenido = '<div class="panel"><h2>¿Cómo te sientes hoy?</h2>'+PREGUNTAS_SINTOMAS.map(function(p){return preguntaSN(p, estado.controlDatos.sintomas[p.id]);}).join("")+'</div>';
    } else {
      contenido = '<div class="panel"><h2>¿Debes acudir al médico?</h2><p class="muted">Aunque solo marques 1 respuesta como "Sí", acude al médico.</p>'+
        PREGUNTAS_URGENCIA.map(function(p){return preguntaSN(p, estado.controlDatos.urgencia[p.id]);}).join("")+'</div>';
    }
    var botonSig = paso<3 ? '<button class="btn-primaria" data-accion="control-siguiente">Continuar</button>' : '<button class="btn-primaria" data-accion="control-finalizar">Ver resultado</button>';
    return encabezado("Control diario") + barra + contenido +
      '<div class="btn-fila"><button class="btn-secundaria" data-accion="control-anterior">'+(paso===1?"Cancelar":"Atrás")+'</button></div>'+

  function preguntaSN(p,v){
    return '<div class="pregunta"><p class="texto">'+esc(p.texto)+'</p><div class="sn">'+
      '<label class="opcion si'+(v==="si"?" marcada":"")+'"><input type="radio" name="q_'+p.id+'" value="si" '+(v==="si"?"checked":"")+' data-id="'+p.id+'">Sí</label>'+
      '<label class="opcion no'+(v==="no"?" marcada":"")+'"><input type="radio" name="q_'+p.id+'" value="no" '+(v==="no"?"checked":"")+' data-id="'+p.id+'">No</label>'+
      '</div></div>';
  }

  // ---------- resultado ----------
  function vistaResultado(){
    var p = estado.perfil, cd = estado.controlDatos;
    var sis = Number(cd.sistolica), dia = Number(cd.diastolica);
    var bp = clasificarBP(cd.sistolica, cd.diastolica);
    var flor = clasificarFlor(cd.sintomas, bp);
    var urgentes = urgenciasActivas(cd.urgencia);
    var tieneUrgencia = urgentes.length>0;
    var tieneSensible = urgentes.some(function(p){return p.sensible;});
    var anterior = estado.registros.length ? estado.registros[0] : null;
    var tendencia = detectarAumentoTension(sis, dia, bp, anterior);

    var html = encabezado("Resultado del día") +
      '<div class="resultado-bp '+bp.clave+'"><div class="etiqueta">'+bp.etiqueta+'</div>'+
      '<p style="margin:0;">'+esc(cd.sistolica)+'/'+esc(cd.diastolica)+' mmHg — '+bp.texto+'</p></div>'+
      '<div class="flor-resultado '+flor.nivel+'"><span class="emoji">'+flor.info.emoji+'</span>'+
      '<div class="nivel">'+flor.info.nombre+'</div><p style="margin:6px 0 0;">'+flor.info.desc+'</p></div>';

    if(tendencia){
      html += '<div class="alerta-tendencia"><h3>📈 Tu presión subió respecto al control anterior</h3>'+
        '<p>Antes ('+esc(formatoFecha(tendencia.anterior.fecha))+'): '+esc(tendencia.anterior.sistolica)+'/'+esc(tendencia.anterior.diastolica)+' mmHg → Ahora: '+esc(cd.sistolica)+'/'+esc(cd.diastolica)+' mmHg.</p>'+
        '<p>Vigila los síntomas de cerca y coméntaselo a tu médico, aunque el valor de hoy no sea alto por sí solo.</p>'+
        '</div>';
    }

    if(tieneUrgencia){
      html += '<div class="alerta-medica"><h3>⚠ Debes acudir al médico</h3>'+
        '<p>Marcaste "Sí" en al menos una señal que requiere atención médica. Aunque sea solo una, acude al médico o a tu centro de salud lo antes posible:</p>'+
        '<ul>'+urgentes.map(function(p){return '<li>'+esc(p.texto)+'</li>';}).join("")+'</ul>'+
        (tieneSensible ? '<p><b>Si tuviste pensamientos de hacerte daño a ti o al bebé, no esperes:</b> busca ayuda ahora mismo con tu contacto de emergencia, tu médico o el centro de salud más cercano.</p>' : '')+
        (p.ceTelefono ? '<a class="btn-llamar" href="'+telHref(p.ceTelefono)+'">📞 Llamar a '+esc(p.ceNombre)+' ('+esc(p.ceTelefono)+')</a>' : '')+
        '</div>';
    }
    html += '<button class="btn-primaria" data-accion="guardar-control" '+(estado.guardando?"disabled":"")+'>'+(estado.guardando?"Guardando…":"Guardar y continuar")+'</button>';
    return html;
  }

  // ---------- historial ----------
  function vistaHistorial(){
    var registros = estado.registros; // ya vienen ordenados desc
    var lista = "";
    if(registros.length===0){
      lista = '<div class="vacio"><span class="emoji">📋</span>Todavía no hay controles registrados.</div>';
    } else {
      lista = registros.map(function(r,i){
        return '<button class="historial-item" data-accion="ver-detalle" data-idx="'+i+'">'+
          '<span class="flor">'+r.flor.info.emoji+'</span>'+
          '<span class="datos"><span class="fecha">'+esc(formatoFecha(r.fecha))+'</span><br>'+
          '<span class="bp"><span class="punto '+r.bp.clave+'"></span>'+esc(r.sistolica)+'/'+esc(r.diastolica)+' mmHg'+
          (r.urgenciasActivas.length ? ' · atención médica' : '')+'</span></span></button>';
      }).join("");
    }
    return encabezado(estado.perfil.nombre) + '<div class="panel"><h2>Historial de controles</h2>'+lista+'</div>'+
      '<button class="btn-texto" data-accion="volver-panel">← Volver</button>';
  }

  // ---------- detalle ----------
  function vistaDetalle(){
    var r = estado.registros[estado.registroVisto];
    if(!r){ estado.pantalla="historial"; return vistaHistorial(); }
    var sintomasSi = PREGUNTAS_SINTOMAS.filter(function(p){return r.sintomas[p.id]==="si";});
    var urgSi = r.urgenciasActivas;
    return encabezado(formatoFecha(r.fecha)) +
      '<div class="resultado-bp '+r.bp.clave+'"><div class="etiqueta">'+r.bp.etiqueta+'</div><p style="margin:0;">'+esc(r.sistolica)+'/'+esc(r.diastolica)+' mmHg</p></div>'+
      '<div class="flor-resultado '+r.flor.nivel+'"><span class="emoji">'+r.flor.info.emoji+'</span><div class="nivel">'+r.flor.info.nombre+'</div></div>'+
      '<div class="panel"><h3>Síntomas marcados como "Sí"</h3>'+
      (sintomasSi.length ? '<ul style="padding-left:20px; margin:0;">'+sintomasSi.map(function(p){return '<li>'+esc(p.texto)+'</li>';}).join("")+'</ul>' : '<p class="muted">Ninguno.</p>')+'</div>'+
      (urgSi.length ? '<div class="alerta-medica"><h3>Se marcó atención médica</h3><ul>'+urgSi.map(function(p){return '<li>'+esc(p.texto)+'</li>';}).join("")+'</ul></div>' : '')+
      '<button class="btn-texto" data-accion="volver-historial">← Volver al historial</button>';
  }

  // ---------- eventos ----------
  function ligarEventos(){
    document.querySelectorAll("[data-accion]").forEach(function(el){
      el.addEventListener("click", function(){
        var a = el.getAttribute("data-accion");
        if(a==="olvide-password"){ estado.pantalla="recuperar"; estado.authError=""; estado.authInfo=""; render(); }
        else if(a==="volver-restaurar"){ estado.pantalla="restaurar"; estado.authError=""; estado.authInfo=""; render(); }
        else if(a==="ir-restaurar"){
          if(confirm("Si en este teléfono ya registraste datos sin copia de seguridad, se quedarán aquí (no se moverán a la otra cuenta). ¿Quieres continuar e iniciar sesión con tu copia de seguridad?")){
            estado.authError=""; estado.authInfo=""; estado.pantalla="restaurar"; render();
          }
        }
        else if(a==="volver-panel-perfil"){
          estado.pantalla = (estado.perfil ? "panel" : "completarPerfil");
          render();
        }
        else if(a==="reintentar-inicio"){ location.reload(); }
        else if(a==="mostrar-respaldo"){ estado.mostrandoRespaldo=true; estado.respaldoError=""; render(); }
        else if(a==="ocultar-respaldo"){ estado.mostrandoRespaldo=false; render(); }
        else if(a==="cerrar-sesion"){
          if(confirm("¿Cerrar sesión? Tus datos seguirán guardados en la nube con tu correo — podrás volver a entrar cuando quieras.")){
            signOut(auth);
          }
        }
        else if(a==="volver-panel"){ estado.pantalla="panel"; render(); }
        else if(a==="iniciar-control"){
          estado.controlPaso=1; estado.controlDatos={sistolica:"",diastolica:"",sintomas:{},urgencia:{}};
          estado.pantalla="control"; render();
        }
        else if(a==="ver-historial"){ estado.pantalla="historial"; render(); }
        else if(a==="editar-consulta"){ estado.editandoConsulta=true; render(); }
        else if(a==="cancelar-consulta"){ estado.editandoConsulta=false; render(); }
        else if(a==="mostrar-qr"){ estado.mostrandoQR=true; render(); }
        else if(a==="ocultar-qr"){ estado.mostrandoQR=false; render(); }
        else if(a==="instalar-app"){
          if(deferredInstallPrompt){
            deferredInstallPrompt.prompt();
            deferredInstallPrompt.userChoice.finally(function(){
              deferredInstallPrompt = null;
              estado.mostrarInstalar = false;
              render();
            });
          }
        }
        else if(a==="cerrar-banner-instalar"){ estado.mostrarInstalar=false; render(); }
        else if(a==="abrir-sidebar"){ estado.sidebarAbierta=true; render(); }
        else if(a==="cerrar-sidebar"){ estado.sidebarAbierta=false; render(); }
        else if(a==="nav-inicio"){ estado.sidebarAbierta=false; estado.pantalla="panel"; render(); }
        else if(a==="nav-historial"){ estado.sidebarAbierta=false; estado.pantalla="historial"; render(); }
        else if(a==="nav-respaldo"){
          estado.sidebarAbierta=false; estado.pantalla="panel";
          if(auth.currentUser && auth.currentUser.isAnonymous) estado.mostrandoRespaldo=true;
          render();
        }
        else if(a==="ver-detalle"){ estado.registroVisto=Number(el.getAttribute("data-idx")); estado.pantalla="detalle"; render(); }
        else if(a==="volver-historial"){ estado.pantalla="historial"; render(); }
        else if(a==="control-anterior"){
          if(estado.controlPaso===1){ estado.pantalla="panel"; } else { estado.controlPaso--; }
          render();
        }
        else if(a==="control-siguiente"){
          if(estado.controlPaso===1){
            var sis=document.getElementById("in-sistolica").value, dia=document.getElementById("in-diastolica").value;
            if(!sis||!dia){ alert("Indica la presión sistólica y diastólica."); return; }
            var sisN=Number(sis), diaN=Number(dia);
            if(sisN<60||sisN>260||diaN<30||diaN>160){
              alert("Revisa los valores — no parecen una presión arterial válida (ej: 120/80).");
              return;
            }
            if(diaN>=sisN){
              alert("La diastólica no puede ser igual o mayor que la sistólica. Revisa los valores (ej: 120/80).");
              return;
            }
            estado.controlDatos.sistolica=sis; estado.controlDatos.diastolica=dia;
          } else if(estado.controlPaso===2){
            var falt=PREGUNTAS_SINTOMAS.some(function(p){return !estado.controlDatos.sintomas[p.id];});
            if(falt){ alert("Responde todas las preguntas para continuar."); return; }
          }
          estado.controlPaso++; render();
        }
        else if(a==="control-finalizar"){
          var faltU=PREGUNTAS_URGENCIA.some(function(p){return !estado.controlDatos.urgencia[p.id];});
          if(faltU){ alert("Responde todas las preguntas para continuar."); return; }
          estado.pantalla="resultado"; render();
        }
        else if(a==="guardar-control"){ guardarRegistroControl(); }
      });
    });

    app.querySelectorAll(".sn input[type=radio]").forEach(function(inp){
      inp.addEventListener("change", function(){
        var id=inp.getAttribute("data-id"), val=inp.value;
        if(estado.controlPaso===2) estado.controlDatos.sintomas[id]=val;
        else if(estado.controlPaso===3) estado.controlDatos.urgencia[id]=val;
        render();
      });
    });

    var formRestaurar = document.getElementById("form-restaurar");
    if(formRestaurar){
      formRestaurar.addEventListener("submit", function(ev){
        ev.preventDefault();
        var email = document.getElementById("restaurar-email").value.trim();
        var pass = document.getElementById("restaurar-pass").value;
        var btn = document.getElementById("restaurar-submit");
        btn.disabled = true; estado.authError=""; estado.authInfo="";
        signInWithEmailAndPassword(auth, email, pass).catch(function(err){
          estado.authError = mensajeErrorAuth(err.code);
          btn.disabled = false;
          render();
        });
      });
    }

    var formRespaldo = document.getElementById("form-respaldo");
    if(formRespaldo){
      formRespaldo.addEventListener("submit", function(ev){
        ev.preventDefault();
        var email = document.getElementById("respaldo-email").value.trim();
        var pass = document.getElementById("respaldo-pass").value;
        estado.respaldoError = "";
        var credencial = EmailAuthProvider.credential(email, pass);
        linkWithCredential(auth.currentUser, credencial).then(function(){
          estado.mostrandoRespaldo = false;
          render();
        }).catch(function(err){
          estado.respaldoError = mensajeErrorAuth(err.code);
          render();
        });
      });
    }

    var formRecuperar = document.getElementById("form-recuperar");
    if(formRecuperar){
      formRecuperar.addEventListener("submit", function(ev){
        ev.preventDefault();
        var email = document.getElementById("recuperar-email").value.trim();
        var btn = document.getElementById("recuperar-submit");
        btn.disabled = true; estado.authError=""; estado.authInfo="";
        sendPasswordResetEmail(auth, email).then(function(){
          estado.authInfo = "Si existe una cuenta con ese correo, te enviamos un enlace para restablecer la contraseña. Revisa también la carpeta de spam.";
          render();
        }).catch(function(err){
          if(err.code === "auth/user-not-found"){
            // No revelamos si el correo existe o no, por privacidad.
            estado.authInfo = "Si existe una cuenta con ese correo, te enviamos un enlace para restablecer la contraseña. Revisa también la carpeta de spam.";
          } else {
            estado.authError = mensajeErrorAuth(err.code);
            btn.disabled = false;
          }
          render();
        });
      });
    }

    var formPerfil = document.getElementById("form-perfil");
    if(formPerfil){
      // Evita fechas de nacimiento o de última regla en el futuro
      var hoyISO = fechaHoyISO();
      var inNac = formPerfil.querySelector('input[name="fechaNacimiento"]');
      var inFur = formPerfil.querySelector('input[name="fur"]');
      if(inNac) inNac.max = hoyISO;
      if(inFur) inFur.max = hoyISO;
      // Mostrar/ocultar los campos de detalle según la respuesta Sí/No
      formPerfil.querySelectorAll("input[data-detalle]").forEach(function(radio){
        radio.addEventListener("change", function(){
          var det = document.getElementById(radio.getAttribute("data-detalle"));
          if(det) det.style.display = (radio.value === "si" && radio.checked) ? "block" : "none";
        });
      });

      formPerfil.addEventListener("submit", function(ev){
        ev.preventDefault();
        var fd = new FormData(formPerfil);
        var perfil = {
          nombre:fd.get("nombre"), apellido:fd.get("apellido"), cedula:fd.get("cedula"),
          fechaNacimiento:fd.get("fechaNacimiento"), fur:fd.get("fur"), direccion:fd.get("direccion"),
          telefono:fd.get("telefono"), ocupacion:fd.get("ocupacion"),
          ceNombre:fd.get("ceNombre"), ceApellido:fd.get("ceApellido"), ceTelefono:fd.get("ceTelefono"),
          antecedentesPersonales: fd.getAll("antecedentesPersonales"),
          cirugiaPrevia: fd.get("cirugiaPrevia") || "no",
          cirugiaPreviaDetalle: fd.get("cirugiaPreviaDetalle") || "",
          alergiaMedicamento: fd.get("alergiaMedicamento") || "no",
          alergiaMedicamentoDetalle: fd.get("alergiaMedicamentoDetalle") || "",
          menarquiaEdad: fd.get("menarquiaEdad") || "",
          duracionMenstruacion: fd.get("duracionMenstruacion") || "",
          edadPrimeraRelacion: fd.get("edadPrimeraRelacion") || "",
          numeroParejasSexuales: fd.get("numeroParejasSexuales") || "",
          etsDiagnostico: fd.get("etsDiagnostico") || "no",
          etsTipos: fd.getAll("etsTipos"),
          etsOtraDetalle: fd.get("etsOtraDetalle") || "",
          proximaConsulta: fd.get("proximaConsulta") || ""
        };
        setDoc(doc(dbase,"usuarias",uidActual), perfil).then(function(){
          estado.perfil = perfil;
          estado.pantalla = "panel";
          suscribirRegistros();
          render();
        });
      });
    }

    var formConsulta = document.getElementById("form-consulta");
    if(formConsulta){
      formConsulta.addEventListener("submit", function(ev){
        ev.preventDefault();
        var fecha = new FormData(formConsulta).get("proximaConsulta") || "";
        setDoc(doc(dbase,"usuarias",uidActual), { proximaConsulta: fecha }, { merge:true }).then(function(){
          estado.perfil.proximaConsulta = fecha;
          estado.editandoConsulta = false;
          render();
        });
      });
    }

    renderizarQRSiCorresponde();
  }

  // ---------- código QR para el médico ----------
  function b64EncodeUnicode(str){
    return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, function(m,p1){ return String.fromCharCode("0x"+p1); }));
  }
  function toBase64Url(b64){ return b64.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }

  function urlDatosQR(){
    // Versión "liviana": solo lo esencial de cada control, sin repetir el
    // texto completo de cada pregunta (eso ya vive en la propia app y en
    // visor.html) — así el código QR tiene margen de sobra de espacio.
    var registrosLivianos = estado.registros.slice(0,5).map(function(r){
      return {
        f: r.fecha,
        s: r.sistolica,
        d: r.diastolica,
        bn: r.bp.nivel,
        fn: r.flor.nivel,
        sc: r.flor.siCount,
        u: r.urgenciasActivas.length
      };
    });
    var resumen = {
      g: fechaHoyISO(),
      p: estado.perfil,
      r: registrosLivianos
    };
    var b64 = toBase64Url(b64EncodeUnicode(JSON.stringify(resumen)));
    var base = location.href.split("#")[0].replace(/[^\/]*$/, "");
    return base + "visor.html#" + b64;
  }

  function renderizarQRSiCorresponde(){
    var cont = document.getElementById("qr-contenedor");
    if(!cont) return;
    cont.innerHTML = "";
    if(typeof QRCode === "undefined"){
      cont.innerHTML = '<p class="muted">No se pudo cargar el generador de código QR. Verifica tu conexión.</p>';
      return;
    }
    try{
      new QRCode(cont, { text: urlDatosQR(), width:200, height:200, correctLevel: QRCode.CorrectLevel.L });
    }catch(e){
      console.error("Error al generar el QR:", e);
      cont.innerHTML = '<p class="muted">No se pudo generar el código: hay demasiada información para un solo QR. Intenta de nuevo o consulta el historial directamente con tu médico.</p>';
    }
  }

  function mensajeErrorAuth(code){
    var m = {
      "auth/invalid-email":"El correo no es válido.",
      "auth/user-not-found":"No existe una cuenta con ese correo.",
      "auth/wrong-password":"Contraseña incorrecta.",
      "auth/invalid-credential":"Correo o contraseña incorrectos.",
      "auth/email-already-in-use":"Ese correo ya tiene una copia de seguridad de otra usuaria. Usa otro correo, o si es tuyo, ve a \"¿Usas otro teléfono?\" e inicia sesión con él.",
      "auth/credential-already-in-use":"Ese correo ya tiene una copia de seguridad de otra usuaria. Usa otro correo, o si es tuyo, ve a \"¿Usas otro teléfono?\" e inicia sesión con él.",
      "auth/weak-password":"La contraseña debe tener al menos 6 caracteres.",
      "auth/network-request-failed":"No hay conexión a internet. Verifica tu red e intenta de nuevo.",
      "auth/operation-not-allowed":"El inicio de sesión con correo y contraseña no está habilitado en Firebase (revisa Authentication → Sign-in method).",
      "auth/unauthorized-domain":"Este sitio no está autorizado en Firebase (revisa Authentication → Settings → Authorized domains).",
      "auth/invalid-api-key":"La configuración de Firebase (apiKey) es inválida. Revisa que se haya copiado bien en index.html.",
      "auth/configuration-not-found":"Falta configuración en el proyecto de Firebase (revisa que Authentication esté habilitado).",
      "auth/admin-restricted-operation":"El inicio de sesión anónimo no está habilitado en Firebase (Authentication → Sign-in method → Anónimo)."
    };
    return m[code] || ("Ocurrió un error ("+code+"). Intenta de nuevo.");
  }

  function guardarRegistroControl(){
    var cd = estado.controlDatos;
    var bp = clasificarBP(cd.sistolica, cd.diastolica);
    var flor = clasificarFlor(cd.sintomas, bp);
    var urgentes = urgenciasActivas(cd.urgencia);
    var registro = {
      fecha: fechaHoyISO(), sistolica: cd.sistolica, diastolica: cd.diastolica,
      bp: bp, sintomas: cd.sintomas, urgencia: cd.urgencia,
      urgenciasActivas: urgentes, flor: flor, creado: Date.now()
    };
    // Firestore aplica la escritura a la caché local de inmediato (el
    // historial la refleja al instante mediante onSnapshot), aunque la
    // promesa solo se resuelve cuando el servidor confirma. Por eso no
    // esperamos aquí: si no hay conexión, quedaría "colgado" hasta que
    // vuelva internet. Navegamos ya y solo mostramos un error si la
    // escritura es realmente inválida (no por falta de red).
    addDoc(collection(dbase,"usuarias",uidActual,"registros"), registro).catch(function(err){
      console.error("Error al guardar el control:", err);
      if(err.code !== "unavailable"){
        alert("Hubo un problema al guardar este control. Vuelve a intentarlo desde el historial.");
      }
    });
    estado.guardando = false;
    estado.pantalla = "panel";
    render();
  }

  function suscribirRegistros(){
    if(unsubRegistros) unsubRegistros();
    var q = query(collection(dbase,"usuarias",uidActual,"registros"), orderBy("creado","desc"));
    unsubRegistros = onSnapshot(q, function(snap){
      estado.registros = snap.docs.map(function(d){ return d.data(); });
      if(estado.pantalla==="panel" || estado.pantalla==="historial") render();
    });
  }

  // ---------- ciclo de autenticación ----------
  onAuthStateChanged(auth, function(user){
    if(unsubRegistros){ unsubRegistros(); unsubRegistros=null; }
    if(!user){
      uidActual = null; estado.perfil = null; estado.registros = [];
      // No hay sesión: iniciamos una anónima automáticamente, sin pedirle
      // nada a la usuaria. onAuthStateChanged volverá a dispararse solo
      // cuando esa sesión anónima quede creada.
      signInAnonymously(auth).catch(function(err){
        console.error("No se pudo iniciar sesión anónima:", err);
        estado.authError = mensajeErrorAuth(err.code);
        estado.pantalla = "sinRedInicial";
        render();
      });
      return;
    }
    uidActual = user.uid;
    getDoc(doc(dbase,"usuarias",uidActual)).then(function(snap){
      if(snap.exists()){
        estado.perfil = snap.data();
        estado.pantalla = "panel";
        suscribirRegistros();
      } else {
        estado.pantalla = "completarPerfil";
      }
      render();
    });
  });
</script>
